name: Scripture Reading

on:
  workflow_dispatch:  # triggered every 15 min by cron-job.org
    inputs:
      force:
        description: "Post now even outside 7 AM to 10:45 PM Pacific"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scripture-reading
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post next verse
        run: python3 post_verse.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_POST: ${{ inputs.force }}

      - name: Save reading progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add progress.json explanations.json 2>/dev/null || git add progress.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update reading progress"
            git push
          fi
