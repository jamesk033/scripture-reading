name: Scripture Reading

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scripture-reading
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post next verse
        run: python3 post_verse.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Save reading progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add progress.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update reading progress"
            git push
          fi
